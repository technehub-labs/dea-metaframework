name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest + deps
        run: pip install pytest pyyaml jsonschema
      - name: Run full test suite
        run: pytest -q tests/ tools/cross_repo_consumer/tests/
