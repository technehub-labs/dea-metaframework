name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest + deps
        run: pip install pytest pyyaml jsonschema
      - name: Run full test suite
        run: pytest -q tests/ tools/cross_repo_consumer/tests/

  # The two self-test modules are dual-runner: pytest discovers their
  # test_* functions, but they also carry a run_all() reporter that only
  # executes under __main__. Running them standalone exercises that second
  # path, which is how these suites are documented to be run outside
  # pytest. Each exits non-zero on any recorded failure.
  self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml jsonschema
      - name: CST self-test (standalone runner)
        run: python tests/test_conformance_catalog_structure.py
      - name: Catalog index machinery self-test (standalone runner)
        run: python tests/test_catalog_index_machinery.py

  # CR-CATALOG-STRUCT-13: every metaframework release-tag pin this repo
  # advertises (template CI fetch, kit generator's emitted pins) must
  # resolve to a tag that exists on origin. A pin merged ahead of its
  # release 404s at every consumer's checkout. Ordering rule:
  # land the change -> cut the release -> bump the pins (own PR).
  pins-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release pins resolve to existing tags (CR-CATALOG-STRUCT-13)
        run: python tools/check_release_pins.py
      - name: Release-pin self-tests
        run: python tests/test_check_release_pins.py
